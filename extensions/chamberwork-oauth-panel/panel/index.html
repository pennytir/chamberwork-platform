<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chamberwork OAuth</title>
  <style>
    * { font-family: 'Fira Code', monospace; box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #f5f5f5; padding: 16px; }
    .status { padding: 12px; border: 2px solid #2a2a4a; margin-bottom: 16px; }
    .status.connected { border-color: #00d2ff; color: #00d2ff; }
    .status.disconnected { border-color: #ff006e; color: #ff006e; }
    button { padding: 8px 16px; background: transparent; color: #f5f5f5; border: 2px solid #f5f5f5; font-weight: 700; text-transform: uppercase; cursor: pointer; font-family: 'Fira Code', monospace; }
    button:hover { background: #e94560; color: #1a1a2e; border-color: #e94560; }
    .info { color: #a0a0a0; font-size: 0.875rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./main.js"></script>
</body>
</html>
