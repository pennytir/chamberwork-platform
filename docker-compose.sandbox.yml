version: '3.8'

services:
  # 6GB Sandboxed Multi-User Runtime (No third-party router dependency)
  multi-user-cde-sandbox:
    image: node:24-bookworm-slim
    container_name: chamberwork-6gb-sandbox
    restart: always
    command: /bin/bash -c "chmod 755 /srv/provision.sh && /srv/provision.sh && tail -f /dev/null"
    environment:
      - NODE_ENV=production
      - DEBIAN_FRONTEND=noninteractive
    deploy:
      resources:
        limits:
          memory: 6144M # Hard 6GB Cap
          cpus: '4.0'
        reservations:
          memory: 2048M
    volumes:
      # Isolated Per-User Workspaces (chmod 0700 per user)
      - /srv/chamberwork/workspaces:/workspaces
      - /srv/chamberwork/configs:/configs
      - /srv/chamberwork/shared-packages:/opt/packages:ro
      - ./sandbox-init.sh:/srv/provision.sh:ro
    ports:
      - "127.0.0.1:3100-3150:3100-3150"
