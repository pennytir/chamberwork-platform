name = "chamberwork-frontend-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "app.chamberwork.space/*", zone_name = "chamberwork.space" }
]

[vars]
VPS_API_URL = "http://127.0.0.1:4000"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "auth_kv_namespace_id_placeholder"

# Cron trigger for 6-hour rolling token rotation
[triggers]
crons = ["0 */6 * * *"]
